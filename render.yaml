services:
  - type: web
    name: chess-tactics-trainer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENGINE_TIME
        value: "0.35"
      - key: ACCEPTABLE_LOSS_CP
        value: "125"
      - key: MAX_PDF_MB
        value: "25"
      - key: MAX_PDF_PAGES
        value: "160"
